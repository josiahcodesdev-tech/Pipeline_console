<!--
  Pipeline Console mark.

  A chevron that doubles as the V of Vantage — the same shape the pipeline bar
  uses between stages, so the tab icon and the app's signature element are the
  same idea.

  Drawn as a stroked path rather than SVG <text>: a favicon cannot depend on a
  font being available, and letterforms rendered by the browser vary. The
  gradient runs gold to brown so the mark keeps contrast against both light and
  dark browser chrome.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="va" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#DAA520"/>
      <stop offset="0.55" stop-color="#A0522D"/>
      <stop offset="1" stop-color="#8B4513"/>
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="7" fill="url(#va)"/>

  <!-- Heavy stroke and generous padding so it still reads at 16px. -->
  <path
    d="M9.5 10.5 L16 21.5 L22.5 10.5"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="4.25"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
